name: Update site when vehicles.csv changes

on:
  push:
    paths:
      - 'vehicles.csv'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate index.html from CSV
        run: python3 generate.py

      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update index.html from vehicles.csv"
          git push
